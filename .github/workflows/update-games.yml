# Commits the new games to dev, with a line under "Unreleased" in CHANGELOG.md. Nothing goes live here: the games
# are published with the next release (dev merged into main).

name: Update games database

on:
  schedule:
    # Every Monday at 05:00 UTC. Adjust as you like.
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      refresh_meta:
        description: "Also refresh title/cover/credits of games already in the database"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Fetch new games and build their constellations
        run: |
          count() { python3 -c 'import json; print(len(json.load(open("data/games.json"))["games"]))'; }
          echo "BEFORE=$(count)" >> "$GITHUB_ENV"
          if [ "${{ github.event.inputs.refresh_meta }}" = "true" ]; then
            python3 scripts/fetch_games.py --refresh-meta
          else
            python3 scripts/fetch_games.py
          fi
          echo "AFTER=$(count)" >> "$GITHUB_ENV"

      - name: Commit the new games and their changelog line
        run: |
          if git diff --quiet -- data; then
            echo "No new games."
            exit 0
          fi
          day="$(date -u +%Y-%m-%d)"
          added=$((AFTER - BEFORE))
          if [ "$added" -gt 0 ]; then
            message="feat(data): add $added new games from swissgames.garden ($day)"
            bunx @geut/chan@3.2.9 added "$message"
          else
            message="feat(data): refresh the games already in the database from swissgames.garden ($day)"
            bunx @geut/chan@3.2.9 changed "$message"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data CHANGELOG.md
          git commit -m "$message"
          git push origin HEAD:dev
